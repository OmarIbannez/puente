# Render Blueprint: a free Postgres plus one free web service running the
# whole image (Go API, web app and worker loop). Render creates the database
# and wires DATABASE_URL to it (internal connection string, no pooler, which
# Puente needs for its per-connection lock and statement timeouts).
#
# Create it once: Render dashboard > New > Blueprint, pick this repository.
# After that, every push to main redeploys once the GitHub Actions checks pass.
databases:
  # Free tier: 1 GB, expires 30 days after creation, and a workspace can have
  # only one active free Postgres. No ipAllowList entries: only services in
  # this workspace can connect.
  - name: puente-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: puente
    user: puente
    ipAllowList: []

services:
  - type: web
    name: puente
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: checksPass
    # Docs-only commits don't need a redeploy.
    buildFilter:
      paths:
        - cmd/**
        - internal/**
        - web/**
        - Dockerfile
        - go.mod
        - go.sum
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: puente-postgres
          property: connectionString
      - key: PUENTE_SEED_DEMO
        value: "true"
      # Rate limits use the client IP Render's proxy appends.
      - key: PUENTE_TRUST_PROXY
        value: "true"
      # Live testnet mode (optional, read-only): watch this address on
      # Base Sepolia (USDC) and Arbitrum Sepolia (MXNB).
      - key: PUENTE_LIVE_WATCH_ADDRESS
        sync: false
      - key: PUENTE_LIVE_USDC_RPC
        value: https://sepolia.base.org
      - key: PUENTE_LIVE_MXNB_RPC
        value: https://sepolia-rollup.arbitrum.io/rpc
